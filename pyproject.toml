[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "frankensurf"
version = "0.21.0"
description = "Evidence-first web substrate: one call to read any site, for any agent on any model"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "playwright>=1.63,<2", "Pillow>=12,<13", "tiktoken>=0.14,<1", "jsonschema>=4.23,<5", "pypdf>=6,<7", "cryptography>=44"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
frankensurf = "frankensurf.cli:main"
frankensurf-mcp = "frankensurf.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frankensurf = ["bundled_routes.json", "bundled_route_seeds.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
