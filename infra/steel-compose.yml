services:
  steel:
    image: ghcr.io/steel-dev/steel-browser-api@sha256:2948a8d8ba1103146dac1c32a121e511955f43976da6905ada0c32fd19b41f59
    container_name: frankensurf-steel-local
    restart: unless-stopped
    shm_size: 1gb
    mem_limit: 3g
    ports:
      - "127.0.0.1:3300:3000"
      - "127.0.0.1:9323:9223"
    environment:
      DOMAIN: "127.0.0.1:3300"
      CDP_DOMAIN: "127.0.0.1:9323"
      DEFAULT_TIMEZONE: "Australia/Sydney"
      LOG_STORAGE_ENABLED: "false"
    labels:
      frankensurf.task: "au-access"
